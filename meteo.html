<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Météo</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#f6a5ba}
  body{background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.45) 0,transparent 45%),linear-gradient(160deg,#f8b3c4,#ec6f90)}
  .boite{box-sizing:border-box;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(4px,1.8vh,10px);padding:14px;text-align:center;color:#fff}
  .lieu{font:700 clamp(11px,3.4vw,14px)/1 system-ui,sans-serif;letter-spacing:2px;text-transform:uppercase;opacity:.95}
  .icone{font-size:clamp(44px,16vw,78px);line-height:1;animation:flotte 4s ease-in-out infinite;filter:drop-shadow(0 6px 12px rgba(140,35,70,.25))}
  @keyframes flotte{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .temp{font:700 clamp(40px,15vw,72px)/1 "Playfair Display",Georgia,serif;letter-spacing:-1px}
  .ciel{font:italic 600 clamp(14px,4.4vw,19px)/1.2 "Playfair Display",Georgia,serif}
  .details{display:flex;gap:clamp(8px,3vw,16px);font:600 clamp(10px,3vw,12px)/1.3 system-ui,sans-serif;opacity:.95;flex-wrap:wrap;justify-content:center}
  .details span{background:rgba(255,255,255,.2);border-radius:999px;padding:4px 10px}
  .conseil{font:600 clamp(10px,3vw,12px)/1.3 system-ui,sans-serif;opacity:.95;max-width:300px}
</style>
</head>
<body>
<div class="boite">
  <div class="lieu" id="lieu">Jarry · Guadeloupe</div>
  <div class="icone" id="icone">☁️</div>
  <div class="temp" id="temp">--°C</div>
  <div class="ciel" id="ciel">Chargement…</div>
  <div class="details" id="details"></div>
  <div class="conseil" id="conseil"></div>
</div>
<script>
  const p=new URLSearchParams(location.search);
  const lat=p.get("lat")||"16.2471", lon=p.get("lon")||"-61.5833", nom=p.get("ville")||"Jarry · Guadeloupe";
  document.getElementById("lieu").textContent=nom;
  const codes={0:["☀️","Grand soleil"],1:["🌤️","Plutôt ensoleillé"],2:["⛅","Quelques nuages"],3:["☁️","Nuageux"],45:["🌫️","Brumeux"],48:["🌫️","Brouillard"],51:["🌦️","Bruine légère"],53:["🌦️","Bruine"],55:["🌧️","Bruine forte"],61:["🌦️","Petite pluie"],63:["🌧️","Pluie"],65:["🌧️","Forte pluie"],66:["🌧️","Pluie verglaçante"],67:["🌧️","Pluie verglaçante"],71:["🌨️","Neige légère"],73:["🌨️","Neige"],75:["❄️","Forte neige"],80:["🌦️","Averses"],81:["🌧️","Averses"],82:["⛈️","Fortes averses"],95:["⛈️","Orage"],96:["⛈️","Orage et grêle"],99:["⛈️","Gros orage"]};
  function conseil(code,t,jour){ if(!jour) return "C'est la nuit : repos, prépare tes idées pour demain 🌙"; if(code>=95) return "Orage : on tourne à l'intérieur aujourd'hui ♡"; if(code>=51) return "Pluie : parfait pour des stories cosy au café ☕"; if(code<=1) return t>=30?"Grand soleil : bois de l'eau et tourne à l'ombre ♡":"Belle lumière : c'est le jour pour tourner dehors 📸"; return "Lumière douce : idéale pour les photos ✨"; }
  async function charge(){
    try{
      const u="https://api.open-meteo.com/v1/forecast?latitude="+lat+"&longitude="+lon+"&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,relative_humidity_2m,is_day&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1";
      const r=await fetch(u); const d=await r.json(); const c=d.current, code=c.weather_code;
      let [ic,txt]=codes[code]||["🌈","Ciel variable"]; if(!c.is_day && code<=1){ ic="🌙"; txt="Nuit claire"; } else if(!c.is_day && code<=3){ ic="☁️"; txt="Nuit nuageuse"; }
      document.getElementById("icone").textContent=ic;
      document.getElementById("temp").textContent=Math.round(c.temperature_2m)+"°C";
      document.getElementById("ciel").textContent=txt;
      document.getElementById("details").innerHTML="<span>↑ "+Math.round(d.daily.temperature_2m_max[0])+"° ↓ "+Math.round(d.daily.temperature_2m_min[0])+"°</span><span>💧 "+c.relative_humidity_2m+" %</span><span>🍃 "+Math.round(c.wind_speed_10m)+" km/h</span>";
      document.getElementById("conseil").textContent=conseil(code,c.temperature_2m,c.is_day);
    }catch(e){ document.getElementById("ciel").textContent="Météo indisponible pour le moment"; }
  }
  charge(); setInterval(charge,15*60*1000);
</script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pluie de pétales</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fde9ef}
  body{background:radial-gradient(ellipse at 50% 0%,#fff6f9 0,transparent 60%),linear-gradient(180deg,#fdeef3,#f9d3de)}
  canvas{display:block;width:100%;height:100%}
  .mot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font:italic 700 clamp(18px,5vw,40px)/1.2 "Playfair Display",Georgia,serif;color:#b03a5b;text-shadow:0 2px 12px rgba(255,255,255,.9);text-align:center;padding:0 12px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="mot" id="mot"></div>
<script>
  const p=new URLSearchParams(location.search); document.getElementById("mot").textContent=p.get("texte")||"";
  const c=document.getElementById("c"), x=c.getContext("2d"); let W,H,dpr;
  function taille(){ dpr=window.devicePixelRatio||1; W=c.clientWidth; H=c.clientHeight; c.width=W*dpr; c.height=H*dpr; x.setTransform(dpr,0,0,dpr,0,0); }
  taille(); addEventListener("resize",taille);
  const couleurs=["#f7b6c8","#f4a0b8","#fbcfdc","#ef8fab","#ffd9e4","#f9c0d0"];
  const nb=Math.round(Math.min(70,Math.max(18,(W*H)/9000)));
  function nouveau(haut){ return {x:Math.random()*W, y:haut?-20-Math.random()*H:Math.random()*H, t:9+Math.random()*11, vy:.35+Math.random()*.9, vx:-.2+Math.random()*.6, a:Math.random()*Math.PI*2, va:-.02+Math.random()*.04, osc:Math.random()*Math.PI*2, c:couleurs[Math.floor(Math.random()*couleurs.length)], f:.4+Math.random()*.6}; }
  const pts=Array.from({length:nb},()=>nouveau(false));
  function petale(q){ x.save(); x.translate(q.x,q.y); x.rotate(q.a); x.scale(1,q.f*Math.abs(Math.cos(q.osc))+.25);
    x.beginPath(); x.moveTo(0,-q.t); x.bezierCurveTo(q.t*.9,-q.t*.6,q.t*.7,q.t*.8,0,q.t); x.bezierCurveTo(-q.t*.7,q.t*.8,-q.t*.9,-q.t*.6,0,-q.t);
    x.fillStyle=q.c; x.globalAlpha=.88; x.fill(); x.globalAlpha=.35; x.strokeStyle="#fff"; x.lineWidth=.8; x.beginPath(); x.moveTo(0,-q.t*.7); x.lineTo(0,q.t*.6); x.stroke(); x.restore(); }
  function boucle(){ x.clearRect(0,0,W,H);
    for(const q of pts){ q.osc+=.03; q.y+=q.vy; q.x+=q.vx+Math.sin(q.osc)*.6; q.a+=q.va; if(q.y>H+20||q.x<-30||q.x>W+30) Object.assign(q,nouveau(true)); petale(q); }
    requestAnimationFrame(boucle); }
  boucle();
</script>
</body>
</html>
